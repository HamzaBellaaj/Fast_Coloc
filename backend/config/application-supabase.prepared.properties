# HISTORICAL TEMPLATE: active configuration now lives in src/main/resources/application.properties.
# The schema has been inspected and the backend implemented; see README.md.
# No automatic DDL, SQL initialization, migration or baseline.
spring.application.name=fastcoloc-backend
server.port=${SERVER_PORT:8001}
spring.datasource.url=${FASTCOLOC_JDBC_URL}
spring.datasource.username=${FASTCOLOC_DB_USERNAME}
spring.datasource.password=${FASTCOLOC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.jpa.properties.hibernate.default_schema=fastcoloc
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.liquibase.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://nklsbubnyznlfpxpxsrp.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://nklsbubnyznlfpxpxsrp.supabase.co/auth/v1/.well-known/jwks.json
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=INFO
# The SecurityFilterChain, audience/claims validator and account status check still need implementation.
# An issuer/JWKS URL alone does not establish account authorization or confirmation.
