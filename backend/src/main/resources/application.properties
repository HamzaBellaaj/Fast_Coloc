spring.application.name=fastcoloc-backend
spring.config.import=optional:file:.env.local[.properties]
server.port=${SERVER_PORT:8001}
spring.datasource.url=${FASTCOLOC_JDBC_URL}
spring.datasource.username=${FASTCOLOC_DB_USERNAME}
spring.datasource.password=${FASTCOLOC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.jpa.properties.hibernate.default_schema=fastcoloc
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
fastcoloc.auth.url=https://nklsbubnyznlfpxpxsrp.supabase.co
fastcoloc.auth.publishable-key=${FASTCOLOC_SUPABASE_PUBLISHABLE_KEY}
fastcoloc.auth.secret-key=${FASTCOLOC_SUPABASE_SECRET_KEY:}
fastcoloc.auth.callback-url=${FASTCOLOC_AUTH_CALLBACK_URL:http://localhost:4200/auth/callback}
fastcoloc.photos.max-count=5
fastcoloc.photos.max-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=51MB
springdoc.api-docs.enabled=${FASTCOLOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${FASTCOLOC_API_DOCS_ENABLED:true}
logging.level.org.springframework=INFO
fastcoloc.frontend-origin=${FASTCOLOC_FRONTEND_ORIGIN:http://localhost:4200}
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=INFO
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.web=INFO
logging.level.root=INFO
debug=false
trace=false
fastcoloc.ai.rent-webhook-url=${FASTCOLOC_RENT_WEBHOOK_URL:http://localhost:32768/webhook/49bec6bd-ad64-4cee-ae90-d0567511a05d}
fastcoloc.ai.timeout-seconds=${FASTCOLOC_RENT_TIMEOUT_SECONDS:180}
fastcoloc.ai.recommendations-webhook-url=${FASTCOLOC_RECOMMENDATIONS_WEBHOOK_URL:http://localhost:32768/webhook/fastcoloc-recommendations}
fastcoloc.ai.recommendations-timeout-seconds=${FASTCOLOC_RECOMMENDATIONS_TIMEOUT_SECONDS:180}

fastcoloc.notifications.enabled=${FASTCOLOC_NOTIFICATIONS_ENABLED:false}
fastcoloc.notifications.webhook-url=${FASTCOLOC_NOTIFICATION_WEBHOOK_URL:}
fastcoloc.notifications.webhook-token=${FASTCOLOC_NOTIFICATION_WEBHOOK_TOKEN:}
fastcoloc.notifications.mode=${FASTCOLOC_NOTIFICATION_MODE:external}
