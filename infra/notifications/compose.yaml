name: fastcoloc-notifications
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: fastcoloc
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./database-init.sql:/docker-entrypoint-initdb.d/notifications.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastcoloc -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_ENABLE_CHAOS: "true"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailbox:/data
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:32768:5678"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: fastcoloc
      DB_POSTGRESDB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:32768/
      N8N_EDITOR_BASE_URL: http://localhost:32768/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    volumes:
      - n8n:/home/node/.n8n
      - ./workflow.json:/seed/workflow.json:ro
      - ./.env.credentials.json:/seed/credentials.json:ro
volumes:
  database:
  n8n:
  mailbox:
